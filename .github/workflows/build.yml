name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Meson and Ninja
        run: pip install meson ninja

      - name: Configure
        run: |
          $env:CC = "clang"
          $env:CXX = "clang++"
          meson setup builddir --backend=ninja --wrap-mode=forcefallback

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d3d-video
          path: builddir/src/d3d_video.exe
