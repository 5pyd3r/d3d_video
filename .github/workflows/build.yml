name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Meson and Ninja
        run: pip install meson ninja

      - name: Setup MSVC and Windows SDK environment
        shell: pwsh
        run: |
          # Find Visual Studio
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          # Find Windows SDK version
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkBinVer = Get-ChildItem "$sdkRoot\bin" -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1
          $sdkIncVer = Get-ChildItem "$sdkRoot\Include" -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1
          # Find MSVC version
          $msvcVer = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1

          # Add fxc/rc to PATH
          echo "$($sdkBinVer.FullName)\x64" >> $env:GITHUB_PATH

          # Set INCLUDE for rc.exe
          $include = @(
              "$vsPath\VC\Tools\MSVC\$($msvcVer.Name)\include"
              "$vsPath\VC\Tools\MSVC\$($msvcVer.Name)\atlmfc\include"
              "$sdkRoot\Include\$($sdkIncVer.Name)\ucrt"
              "$sdkRoot\Include\$($sdkIncVer.Name)\um"
              "$sdkRoot\Include\$($sdkIncVer.Name)\shared"
          ) -join ';'
          echo "INCLUDE=$include" >> $env:GITHUB_ENV

          # Set LIB for linker
          $lib = @(
              "$vsPath\VC\Tools\MSVC\$($msvcVer.Name)\lib\x64"
              "$vsPath\VC\Tools\MSVC\$($msvcVer.Name)\atlmfc\lib\x64"
              "$sdkRoot\Lib\$($sdkIncVer.Name)\ucrt\x64"
              "$sdkRoot\Lib\$($sdkIncVer.Name)\um\x64"
          ) -join ';'
          echo "LIB=$lib" >> $env:GITHUB_ENV

      - name: Configure
        run: |
          $env:CC = "clang-cl"
          $env:CXX = "clang-cl"
          meson setup builddir --backend=ninja --wrap-mode=forcefallback

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d3d-video
          path: builddir/src/d3d_video.exe
