name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Meson and Ninja
        run: pip install meson ninja

      - name: Setup MSVC environment via vcvars64
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $envBlock = cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" > nul && set"
          $envBlock -split "`n" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH)=(.*)$') {
              echo "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
            }
          }

          # Also add fxc/rc to PATH
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $sdkVer = Get-ChildItem $sdkRoot -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1
          echo "$($sdkVer.FullName)\x64" >> $env:GITHUB_PATH

      - name: Configure
        run: |
          $env:CC = "clang-cl"
          $env:CXX = "clang-cl"
          meson setup builddir --backend=ninja --wrap-mode=forcefallback

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d3d-video
          path: builddir/src/d3d_video.exe
